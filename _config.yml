remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache
  - jekyll-sitemap

title: "Michail Sapkas (Μιχαήλ Σάπκας)"
description: "description: "Michail Sapkas (Μιχαήλ Σάπκας), PhD at the University of Padova. Researcher in Hardware Accelerators for Edge AI, exploring Particle Physics in CMS Experiment at CERN. Discover my research, portfolio, and education background."
"
author:
  name: "Michail Sapkas (Μιχαήλ Σάπκας)"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"

links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/michail-sapkas-270006223"

    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Msapkas"

    - label: "Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/michail.sapkas/"

# Navigation bar
navigation:
  - title: "About Me"
    url: /
  - title: "Education"
    url: /education/
  - title: "Current Research Interests"
    url: /current_research/
  - title: "Portfolio"
    url: /portfolio/

collections:
  pages:
    output: true
    permalink: /:title/

# Removes the "Recent Posts" section from the bottom of the main page
show_recent_posts: false
show_excerpts: false  # Disable post previews
paginate: false  # Disable pagination

# Helps with the layout of the page
defaults:
  - scope:
      path: "index.md"
    values:
      layout: home

  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

sass:
  style: compressed  # Compress CSS for faster load times