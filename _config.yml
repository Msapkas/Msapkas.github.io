  - jekyll-sitemap

title: "Michail Sapkas (Μιχαήλ Σάπκας)"
description: "Personal website of Michail Sapkas (Μιχαήλ Σάπκας), PhD, University of Padova , you can find information about me, my research, my portfolio and some photos. "
author:
  name: "Michail Sapkas (Μιχαήλ Σάπκας)"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"

links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "www.linkedin.com/in/michail-sapkas-270006223"
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Msapkas"
    - label: "Instagram"
      icon: "fab fa-instagram"
      url: "https://www.instagram.com/michail.sapkas/"

main:
  - title: "About Me"
    url: /
  - title: "Education"
    url: /education/
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/

# Navigation bar
navigation:
  - title: "About Me"
    url: /
  - title: "Education"
    url: /education/
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/

collections:
  pages:
    output: true
    permalink: /:name/

# Removes the "Recent Posts" section from the bottom of the main page
show_recent_posts: false

# Helps with the layout of the page
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

# To center the content on the page
sass:
  style: compressed