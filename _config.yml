remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache

title: "Michail Sapkas"
description: "Personal website of Michail Sapkas, you can find information about me, my research, my portfolio and some photos."
author:
  name: "Michail Sapkas"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"

# Disable pagination (Remove Previous/Next buttons)
paginate: false
paginator: false
show_previous_next: false

main:
  - title: "About Me"
    url: /
  - title: "Education"
    url: /education/
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/

paginate: false
paginator: false
show_previous_next: false

# Navigation bar
navigation:
  - title: "About Me"
    url: /
  - title: "Education"
    url: /education/
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/

paginate: false
paginator: false
show_previous_next: false

collections:
  pages:
    output: true
    permalink: /:name/
    paginate: false
    paginator: false
    show_previous_next: false

# Removes the "Recent Posts" section from the bottom of the main page
show_recent_posts: false
paginate: false
paginator: false
show_previous_next: false

# Helps with the layout of the page
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

paginate: false
paginator: false
show_previous_next: false

# To center the content on the page
sass:
  style: compressed

paginate: false
paginator: false
show_previous_next: false
