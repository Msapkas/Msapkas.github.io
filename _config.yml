remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache

title: "Michail Sapkas"
description: "Personal website of Michail Sapkas, you can find information about me, my research, my portfolio and some photos."
author:
  name: "Michail Sapkas"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"

main:
  - title: "About Me"
    url: /
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/
  - title: "Photos"
    url: /photos/

# Navigation
navigation:
  - title: "About Me"
    url: /
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/
  - title: "Photos"
    url: /photos/

collections:
  pages:
    output: true
    permalink: /:name/

show_recent_posts: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single
      classes: wide

sass:
  style: compressed
