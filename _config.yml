remote_theme: mmistakes/minimal-mistakes

plugins:
  - jekyll-include-cache

title: "Michail Sapkas"
description: "Personal website of Michail Sapkas, you can find information about me, my research, my portfolio and some photos."
author:
  name: "Michail Sapkas"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"

main:
  - title: "About Me"
    url: /
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/
  - title: "Photos"
    url: /photos/

# Navigation bar
navigation:
  - title: "About Me"
    url: /
  - title: "Current Research Interests"
    url: /research/
  - title: "Portfolio"
    url: /portfolio/
  - title: "Photos"
    url: /photos/

collections:
  pages:
    output: true
    permalink: /:name/

# Removes the "Recent Posts" section from the bottom of the main page
show_recent_posts: false

# Helps with the layout of the page
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

# To center the content on the page
sass:
  style: compressed

# To remove the "Next" and "Previous" links from the bottom of the page
paginate: false
related: false