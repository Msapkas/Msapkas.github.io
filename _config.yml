remote_theme: mmistakes/minimal-mistakes

minimal_mistakes_skin: "contrast"

# "air", "aqua", "sunrise", "dark", "dirt", "neon", "mint", "plum", "default"

plugins:
  - jekyll-include-cache
  - jekyll-sitemap

title: "Michail Sapkas (Μιχαήλ Σάπκας)"
locale: "en-US"
og_image: "/assets/images/miku_versal-min.png"
description: "Michail Sapkas (Μιχαήλ Σάπκας), PhD at the University of Padova. Researcher in Edge AI & Hardware Accelerators, exploring Particle Physics in CMS at CERN"

logo: /assets/images/infn-min.png

author:
  name: "Michail Sapkas"
  avatar: "/assets/images/miku_versal-min.png"
  bio: "PhD researcher in Physics at the University of Padova (INFN Padova). Working on edge AI, FPGAs and the AMD Versal AI Engine for particle physics and accelerators, with a talk at CERN."
  location: "Padova, Veneto, Italy"
  email: "michail.sapkas@phd.unipd.it"
  github: "/Msapkas"
  linkedin: "/michail-sapkas-270006223"
  instagram: "michail.sapkas/"

# Site Settings
url: "https://msapkas.github.io"
baseurl: "/"
permalink: pretty
timezone: "Europe/Rome"

# Social Media Links
links:
  - label: "LinkedIn"
    icon: "fab fa-linkedin"
    url: "https://www.linkedin.com/in/michail-sapkas-270006223"
  - label: "GitHub"
    icon: "fab fa-github"
    url: "https://github.com/Msapkas"
  - label: "Instagram"
    icon: "fab fa-instagram"
    url: "https://www.instagram.com/michail.sapkas/"

# Navigation Bar
navigation:
  - title: "About"
    url: /
  - title: "Research"
    url: /research/
  - title: "Projects"
    url: /portfolio/
  - title: "Publications"
    url: /publications/
  - title: "Talks & Posters"
    url: /talks/
  - title: "Conferences"
    url: /conferences/
  - title: "Education"
    url: /education/
  - title: "CV"
    url: /cv/

# Page Settings
collections:
  pages:
    output: true
    permalink: /:title/

# Remove "Recent Posts" from Home Page
show_recent_posts: false
show_excerpts: false  
paginate: false  

# Layout Settings
defaults:
  - scope:
      path: "index.md"
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: "pages"
    values:
      layout: single

# CSS Optimization
sass:
  style: compressed  # Compress CSS for faster load times
